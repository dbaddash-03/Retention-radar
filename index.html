<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retention Radar</title>
<style>
:root{--bg:#0A1020;--pn:#111A31;--ln:#26355A;--tx:#E8EEFF;--mu:#8C9BC2;--ok:#5CE1E6;--mid:#FFC857;--bad:#FF6B57}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 700px at 60% -10%,#16254A,var(--bg));color:var(--tx);font:15px/1.5 ui-sans-serif,system-ui,"Segoe UI",sans-serif;min-height:100vh}
header{padding:20px 28px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}h1{margin:0;font-size:22px;letter-spacing:-.01em}
.mu{color:var(--mu);font-size:13px}main{display:grid;grid-template-columns:320px 1fr 340px;gap:18px;padding:0 28px 28px}
@media(max-width:1100px){main{grid-template-columns:1fr}}
.pn{background:color-mix(in srgb,var(--pn) 88%,transparent);border:1px solid var(--ln);border-radius:20px;padding:18px}
h2{font-size:13px;margin:0 0 12px;color:var(--mu);font-weight:600}
label{display:flex;justify-content:space-between;font-size:13px;margin-top:12px}label b{font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--ok)}select{width:100%;background:#0D1530;color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:8px}
.sw{display:flex;gap:16px;margin-top:14px;font-size:13px}
.radar{display:grid;place-items:center;position:relative}svg{width:100%;max-width:560px}
.sweep{transform-origin:250px 250px;animation:sp 5s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.blip{transition:cx .6s cubic-bezier(.2,.8,.2,1),cy .6s cubic-bezier(.2,.8,.2,1),fill .4s}
.big{position:absolute;text-align:center;bottom:6%}.big b{font-size:46px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;color:#0A1020}
.dr{display:grid;grid-template-columns:1fr 120px;gap:8px;align-items:center;margin:9px 0;font-size:13px}
.bar{height:8px;background:#0D1530;border-radius:9px;position:relative}.bar i{position:absolute;top:0;height:8px;border-radius:9px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:6px 0;border-bottom:1px solid var(--ln)}th{color:var(--mu);font-weight:500}
textarea{width:100%;height:150px;background:#0D1530;color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:10px;font:13px/1.5 inherit;resize:vertical}
button{background:var(--ok);color:#06202a;border:0;border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;margin-top:8px}
</style></head><body>
<header><h1>Retention Radar</h1><span class="mu" id="meta">Loading models…</span></header>
<main>
<section class="pn"><h2>CUSTOMER PROFILE</h2><div id="ctl"></div></section>
<section class="pn radar"><svg viewBox="0 0 500 500" aria-label="Churn risk radar">
<g fill="none" stroke="var(--ln)"><circle cx="250" cy="250" r="60"/><circle cx="250" cy="250" r="120"/><circle cx="250" cy="250" r="185"/><circle cx="250" cy="250" r="240"/><path d="M250 10V490M10 250H490"/></g>
<circle cx="250" cy="250" r="60" fill="rgba(255,107,87,.14)"/>
<g class="sweep"><path d="M250 250L250 10A240 240 0 0 1 420 80Z" fill="rgba(92,225,230,.13)"/><path d="M250 250V10" stroke="var(--ok)" stroke-width="2"/></g>
<circle id="ring" cx="250" cy="250" r="14" fill="none" stroke="var(--ok)" stroke-opacity=".5"/><circle id="bl" class="blip" cx="250" cy="70" r="9" fill="var(--ok)"/>
<text x="250" y="28" fill="var(--mu)" font-size="11" text-anchor="middle">SAFE</text><text x="250" y="256" fill="var(--bad)" font-size="11" text-anchor="middle" opacity=".8">CHURN ZONE</text></svg>
<div class="big"><b id="pct">–</b><div><span class="tag" id="lvl">…</span></div><div class="mu" id="dec" style="margin-top:6px"></div></div></section>
<aside style="display:grid;gap:18px;align-content:start">
<div class="pn"><h2>WHAT IS MOVING THE RISK</h2><div id="dr"></div></div>
<div class="pn"><h2>RETENTION MESSAGE</h2><textarea id="em" readonly></textarea><button id="cp">Copy message</button></div>
<div class="pn"><h2>BATCH SCORING (CSV)</h2><input type="file" id="bf" accept=".csv" aria-label="Upload CSV"><div id="bo" class="mu" style="margin-top:10px"></div></div>
<div class="pn"><h2>MODEL LEADERBOARD (5-FOLD CV)</h2><table id="lb"></table></div></aside></main>
<script>
const F=[["CreditScore","Credit score",300,850,1],["Age","Age",18,90,1],["Tenure","Tenure (years)",0,10,1],["Balance","Balance (₹/€)",0,250000,1000],["NumOfProducts","Products held",1,4,1],["EstimatedSalary","Est. salary",10000,200000,1000]];
const V={CreditScore:650,Geography:"France",Gender:"Female",Age:42,Tenure:3,Balance:90000,NumOfProducts:1,HasCrCard:1,IsActiveMember:0,EstimatedSalary:80000};
const $=i=>document.getElementById(i),ctl=$("ctl");
ctl.innerHTML=F.map(([k,l,a,b,s])=>`<label>${l}<b id="v_${k}">${V[k]}</b></label><input type="range" id="${k}" min="${a}" max="${b}" step="${s}" value="${V[k]}">`).join("")+
`<label>Country</label><select id="Geography"></select><label>Gender</label><select id="Gender"><option>Female<option>Male</select>
<div class="sw"><label style="margin:0;gap:6px"><input type="checkbox" id="HasCrCard" checked>Card</label><label style="margin:0;gap:6px"><input type="checkbox" id="IsActiveMember">Active</label></div>`;
const NAME={CreditScore:"Credit score",Geography:"Country",Gender:"Gender",Age:"Age",Tenure:"Tenure",Balance:"Balance",NumOfProducts:"Products held",HasCrCard:"Credit card",IsActiveMember:"Activity",EstimatedSalary:"Salary"};
let t,last;ctl.oninput=()=>{clearTimeout(t);F.forEach(([k])=>{V[k]=+$(k).value;$("v_"+k).textContent=V[k].toLocaleString()});V.Geography=$("Geography").value;V.Gender=$("Gender").value;V.HasCrCard=+$("HasCrCard").checked;V.IsActiveMember=+$("IsActiveMember").checked;t=setTimeout(go,120)};
async function go(){const r=await (await fetch("/api/predict",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(V)})).json();last=r;draw(r)}
function draw({risk:p,drivers:d,contact:ct}){$("dec").textContent=ct?"Outreach pays off at this risk":"Below the outreach threshold";const c=p<.25?"var(--ok)":p<.5?"var(--mid)":"var(--bad)",lv=p<.25?"Low risk":p<.5?"Watch":"High risk",rad=240*(1-p)*.98+8,ang=(-60+p*30)*Math.PI/180;
const bl=$("bl");bl.setAttribute("cx",250+rad*Math.sin(-ang+Math.PI/1.5)*.0+rad*Math.cos(ang-Math.PI/2+1.1)*0);bl.setAttribute("cx",250+rad*Math.sin(.9+p*2));bl.setAttribute("cy",250-rad*Math.cos(.9+p*2));bl.setAttribute("fill",c);
$("ring").setAttribute("cx",bl.getAttribute("cx"));$("ring").setAttribute("cy",bl.getAttribute("cy"));$("ring").setAttribute("stroke",c);
$("pct").textContent=(p*100).toFixed(1)+"%";$("pct").style.color=c;$("lvl").textContent=lv;$("lvl").style.background=c;
$("dr").innerHTML=d.map(x=>{const w=Math.min(50,Math.abs(x.impact)*220),up=x.impact>0;return`<div class="dr"><span>${NAME[x.feature]} <span class="mu">${typeof x.value=="number"?x.value.toLocaleString():x.value}</span></span><div class="bar"><i style="${up?"left":"right"}:50%;width:${w}%;background:${up?"var(--bad)":"var(--ok)"}"></i></div></div>`}).join("")+`<p class="mu" style="margin:8px 0 0">Red pushes risk up, cyan pulls it down, versus a typical customer.</p>`;
const top=d.find(x=>x.impact>0),why={IsActiveMember:"we noticed you have been less active lately",NumOfProducts:"we would like to make sure your accounts fit your needs",Age:"we have services designed for your stage of life",Balance:"we can help your savings work harder",Geography:"we are improving what we offer in your region",CreditScore:"we can help you strengthen your credit profile",Tenure:"we value the time you have banked with us"};
$("em").value=p<.25?"Customer looks stable. No outreach needed; keep routine service and revisit in 90 days.":`Subject: A thank-you, and something for you\n\nHello,\n\nThank you for banking with us. ${top?"We are reaching out because "+(why[top.feature]||"we value you")+".":""} A relationship manager can offer a fee-free review of your accounts and a personalised offer${p>=.5?", with priority support this month":""}.\n\nReply to this message or call us any time.\n\nWarm regards,\nYour Bank Team`}
$("cp").onclick=()=>navigator.clipboard&&navigator.clipboard.writeText($("em").value);
fetch("/api/meta").then(r=>r.json()).then(m=>{$("Geography").innerHTML=m.geos.map(g=>`<option>${g}`).join("");V.Geography=m.geos[0];
$("meta").textContent=`${m.rows.toLocaleString()} customers, ${m.churn_rate}% churned. ${m.best}, hold-out AUC ${m.holdout.auc}. Outreach threshold ${(m.threshold*100).toFixed(0)}% risk.`;
$("lb").innerHTML="<tr><th>Model<th>AUC<th>PR-AUC</tr>"+m.board.map(b=>`<tr><td>${b.model}<td>${b.auc}<td>${b.ap}</tr>`).join("")+`<tr><td colspan=3 class="mu" style="padding-top:10px">At the threshold, a test run earns ${m.economics.profit_at_threshold.toLocaleString()} versus ${m.economics.profit_contact_everyone.toLocaleString()} for contacting everyone.</tr>`;go()});
$("bf").onchange=async e=>{const f=e.target.files[0];if(!f)return;const r=await fetch("/api/batch",{method:"POST",headers:{"Content-Type":"text/csv"},body:await f.text()}),j=await r.json();
$("bo").innerHTML=j.error?`<span style="color:var(--bad)">${j.error}</span>`:`${j.n} scored, ${j.flagged} flagged for outreach, mean risk ${(j.mean_risk*100).toFixed(1)}%.<br>Drift: ${Object.entries(j.drift).filter(([k,v])=>v.status!="stable").map(([k,v])=>k+" ("+v.status+", PSI "+v.psi+")").join(", ")||"none detected"}<table>${j.top.map(t=>`<tr><td>${t.id}<td>${(t.risk*100).toFixed(1)}%</tr>`).join("")}</table>`};
</script></body></html>
